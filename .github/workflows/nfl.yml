name: NFL schedule

# Refreshes data/nfl.json (this week's games, scores and stadiums) for the NFL tab every 2 hours,
# plus runs right after 12:30am Pacific on Tuesday, when the finished week is archived and the
# next week's games load (07:35 UTC = 12:35am PDT, 08:35 UTC = 12:35am PST; the script decides).
on:
  schedule:
    - cron: "17 */2 * * *"
    - cron: "35 7,8 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/nfl.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl.json
          if [ -d data/nfl/weeks ]; then git add data/nfl/weeks; fi
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "NFL schedule $(date -u +%F)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q && exit 0; sleep $((i * 3)); done
          exit 1
