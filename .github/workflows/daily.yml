name: Daily forecast log

# Sets each source's forecast at 6am Pacific and scores yesterday's.
# GitHub cron runs in UTC: 13:07 and 14:07 UTC cover 6am in both PDT and PST
# (the script skips the run that lands at 5am). 15:07 is a backup in case
# GitHub delays or drops a scheduled run.
on:
  schedule:
    - cron: "7 13,14,15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Set today's forecast now, even if it isn't 6am"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set forecasts and score finished days
        run: node scripts/daily.mjs
        env:
          FORCE: ${{ inputs.force }}
          # API keys live in Settings > Secrets and variables > Actions (missing ones are skipped)
          PIRATE_KEY: ${{ secrets.PIRATE_KEY }}
          TOMORROW_KEY: ${{ secrets.TOMORROW_KEY }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          VISUALCROSSING_KEY: ${{ secrets.VISUALCROSSING_KEY }}
          OWM_KEY: ${{ secrets.OWM_KEY }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "Forecast log $(TZ=America/Los_Angeles date +%F)"
            git push
          fi

  deploy:
    needs: log
    uses: ./.github/workflows/pages.yml
