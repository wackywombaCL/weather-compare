name: Stadium orientation

# One-off helper: measures which way each open-air NFL field runs, from OpenStreetMap.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only stadiums whose name matches (regex), blank for all"
        required: false

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/stadium-orientation.mjs
        env:
          ONLY: ${{ inputs.only }}
